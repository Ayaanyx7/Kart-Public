name: Android CI

on:
  workflow_dispatch:
  push:
    branches: [ android, gpu-test ] # Runs on your main android or test branches
  pull_request:
    branches: [ android ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3
      with:
        submodules: recursive # Downloads the gl4es rendering module automatically

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Clean and Reset Gradle Cache
      run: |
        cd android
        ./gradlew clean
        rm -rf app/.externalNativeBuild/
        rm -rf app/.cxx/
        rm -rf .gradle/

    - name: Build with Gradle
      run: |
        cd android
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: srb2k-gpu-build
        path: android/app/build/outputs/apk/debug/
